# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-09

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# ---------------------------------------------------------------------------
# Soul Vessels — set 2026-11-13 from the user's setup answers (see
# docs/design/decision-log.md, D-001..D-006).
# ---------------------------------------------------------------------------

project:
  name: "Soul Vessels"
  stage: "Technical Setup"       # mirrored in production/stage.txt
  goal: mobile

modes:
  rigor: minimal                 # docs/design/* is the design record; no GDDs
  automation: autonomous         # user: "I want you to drive"; batch questions
  automation_always_ask: [scope_changes, file_deletions, schema_changes]

platform:
  multiplayer: false
  online: false
  targets: [Mobile, PC]          # Android ARM64 primary; Windows for testing
  primary_input: "Touch"
  gamepad_support: "Full"
  touch_support: "Full"
  cert_tier: none

engine:
  name: "Godot"
  version: "4.7.2"
  language: "GDScript"
  rendering: "Mobile"
  physics: "Jolt"
  code_root: src
  test_root: tests
  path: "engine/godot/Godot_v4.7.2-stable_win64_console.exe"
  java_sdk: "engine/jdk-17"
  android_sdk: "C:/Users/ACHRAF CHARKAM/AppData/Local/Android/Sdk"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: []

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

performance:
  target_framerate: 60
  frame_budget_ms: 16.67
  draw_call_limit: null
  memory_ceiling_mb: 1800
  enforce: warn

commands:
  run: "engine/godot/Godot_v4.7.2-stable_win64_console.exe --path . --windowed --resolution 1280x720"
  build: "bash tools/build/export_android.sh"
  test: "bash tests/run_tests.sh"
  smoke: "bash tests/smoke.sh"
